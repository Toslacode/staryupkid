<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARTUPKID — אב־טיפוס משרד</title>
<style>
  :root{
    --bg:#0b0820; --panel:rgba(22,14,54,.92); --panel2:rgba(34,22,78,.95);
    --cyan:#5dd6ff; --purple:#c86bff; --gold:#ffd166; --text:#efeaff; --muted:#a79ad0;
    --sales:#ff7a59; --product:#5dd6ff; --marketing:#c86bff; --research:#7dffb0;
  }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:"Segoe UI","Heebo","Rubik","Assistant","Noto Sans Hebrew","Arial Hebrew",Arial,"DejaVu Sans",sans-serif;
    color:var(--text);user-select:none;-webkit-user-select:none}
  #viewport{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#1a1240 0%,#0b0820 70%)}
  #stage{position:absolute;width:1280px;height:760px;transform-origin:0 0;overflow:hidden}
  /* #world is moved/zoomed by the camera; #ui never moves */
  #world{position:absolute;left:0;top:0;width:1280px;height:760px;transform-origin:0 0;will-change:transform}
  #ui{position:absolute;inset:0;z-index:10;pointer-events:none}
  #game{position:absolute;left:0;top:0;width:1280px;height:760px;display:block;cursor:default}
  #game.grab{cursor:grabbing}

  /* ---------- HUD ---------- */
  #hud{position:absolute;left:0;right:0;top:0;height:90px;pointer-events:none;display:flex;align-items:center;
    justify-content:space-between;padding:0 22px;box-sizing:border-box;font-size:14px}
  #hud>div{display:flex;align-items:center;gap:12px;pointer-events:auto}
  #hudCenter{margin-top:26px}
  .chip{background:rgba(12,8,36,.72);border:1px solid rgba(93,214,255,.28);border-radius:12px;padding:6px 12px;
    box-shadow:0 0 14px rgba(93,214,255,.10) inset, 0 2px 10px rgba(0,0,0,.35);white-space:nowrap;line-height:1.25}
  .chip small{display:block;color:var(--muted);font-size:11px}
  .chip b{font-size:17px;letter-spacing:.2px}
  #money b{color:var(--gold);text-shadow:0 0 10px rgba(255,209,102,.55)}
  .dots i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-start:3px;background:var(--cyan);
    box-shadow:0 0 6px var(--cyan);vertical-align:middle;transition:all .2s}
  .dots i.off{background:#3a3160;box-shadow:none}
  #timerWrap{position:relative;width:64px;height:64px}
  #timerWrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
  #timerWrap .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;
    text-shadow:0 0 8px rgba(93,214,255,.6)}
  .btn{background:linear-gradient(180deg,#8d5bff,#5d34d8);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:12px;
    padding:9px 16px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 18px rgba(141,91,255,.45), 0 0 0 1px rgba(0,0,0,.3);
    transition:transform .08s,filter .15s}
  .btn:hover{filter:brightness(1.12)} .btn:active{transform:translateY(1px) scale(.98)}
  .btn:disabled{filter:grayscale(.7) brightness(.6);cursor:not-allowed;box-shadow:none}
  .btn.cyan{background:linear-gradient(180deg,#39c2f2,#1e7fb8);box-shadow:0 4px 18px rgba(57,194,242,.45)}
  .btn.ghost{background:rgba(12,8,36,.72);box-shadow:none;border-color:rgba(93,214,255,.28);font-weight:600;font-size:13px;padding:7px 12px}
  .btn.ghost.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px rgba(255,209,102,.35)}
  #openBtn{animation:pulse 1.6s ease-in-out infinite;font-size:17px;padding:10px 26px}
  #openBtn.hidden{display:none}
  @keyframes pulse{0%,100%{box-shadow:0 4px 18px rgba(141,91,255,.45)}50%{box-shadow:0 4px 28px rgba(141,91,255,.95),0 0 0 4px rgba(141,91,255,.25)}}
  .hidden{display:none !important}

  /* ---------- Team tray ---------- */
  #tray{position:absolute;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;justify-content:center;gap:8px;
    pointer-events:none;font-size:12px}
  #tray .label{color:var(--muted);font-size:11px;margin-inline-end:4px}
  .tchip{pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(14,9,40,.85);border:1px solid rgba(255,255,255,.14);
    border-radius:10px;padding:4px 9px 4px 7px;cursor:grab;transition:border-color .15s,transform .1s;touch-action:none}
  .tchip:hover{border-color:var(--cyan);transform:translateY(-1px)}
  .tchip.dragging{opacity:.35}
  .tchip .dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 6px currentColor}
  .tchip .as{color:var(--muted);font-size:11px}
  .tchip .as.work{color:#fff}
  .tchip .lvl{color:var(--gold);font-size:10px}
  .tchip .fat{width:26px;height:4px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
  .tchip .fat i{display:block;height:100%;border-radius:3px;transition:width .3s}
  #dragGhost{position:absolute;pointer-events:none;z-index:50;transform:translate(-50%,-50%);background:rgba(30,18,80,.95);
    border:1px solid var(--cyan);border-radius:10px;padding:5px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.5)}

  /* ---------- Contextual popups ---------- */
  .popup{position:absolute;width:236px;background:var(--panel);border:1px solid rgba(93,214,255,.35);border-radius:14px;
    padding:10px 12px;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4);font-size:12px;z-index:30;
    animation:popin .14s ease-out;backdrop-filter:blur(3px)}
  @keyframes popin{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
  .popup .ph{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
  .popup .ph b{font-size:15px}
  .popup .ph .type{color:var(--muted);font-size:11px}
  .popup .ability{background:rgba(255,255,255,.06);border-radius:8px;padding:5px 8px;margin:6px 0;line-height:1.35}
  .popup .ability b{color:var(--gold)}
  .popup .stat{display:flex;align-items:center;gap:6px;margin:4px 0;color:var(--muted);font-size:11px}
  .popup .stat .bar{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
  .popup .stat .bar i{display:block;height:100%;border-radius:4px}
  .popup .q{font-size:14px;font-weight:700;margin:2px 0 8px;text-align:center}
  .opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opt{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--text);border-radius:9px;padding:6px 4px;
    font:inherit;font-size:12px;font-weight:600;cursor:pointer;position:relative;line-height:1.2;transition:background .12s,transform .08s}
  .opt:hover:not(:disabled){background:rgba(255,255,255,.16);transform:translateY(-1px)}
  .opt:disabled{opacity:.42;cursor:not-allowed}
  .opt.cur{outline:2px solid var(--gold);outline-offset:-2px}
  .opt small{display:block;font-weight:400;font-size:10px;color:var(--muted)}
  .opt .k{position:absolute;top:2px;left:5px;font-size:9px;color:var(--muted);font-weight:400}
  .popup .foot{margin-top:7px;color:var(--muted);font-size:11px;text-align:center;min-height:14px}
  .popup .foot.warn{color:#ffb4a2}

  /* ---------- Summary panel ---------- */
  #summary{position:absolute;right:26px;top:96px;width:384px;max-height:604px;overflow:auto;pointer-events:auto;background:rgba(17,10,44,.975);backdrop-filter:blur(6px);
    border:1px solid rgba(200,107,255,.45);border-radius:16px;padding:12px 15px;box-shadow:0 14px 50px rgba(0,0,0,.65);z-index:25;
    font-size:13px;animation:popin .2s ease-out;box-sizing:border-box}
  #summary h2{margin:0 0 2px;font-size:19px}
  #summary .big{font-size:27px;font-weight:800;color:var(--gold);text-shadow:0 0 14px rgba(255,209,102,.5)}
  #summary .delta{color:var(--muted);font-size:12px;margin-bottom:6px}
  #summary .delta.up{color:#8dffb0} #summary .delta.down{color:#ff9a8a}
  #summary h3{margin:7px 0 3px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .row{display:flex;align-items:center;gap:8px;margin:2px 0}
  .row .nm{width:66px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .bar{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden}
  .row .bar i{display:block;height:100%;border-radius:5px}
  .row .amt{width:50px;text-align:left;font-variant-numeric:tabular-nums;color:#fff}
  .row .vd{width:96px;font-size:11px;color:var(--muted);text-align:left}
  .row .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .tip{background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.3);border-radius:10px;padding:6px 9px;margin:8px 0 4px;line-height:1.35;font-size:12px}
  .up{display:flex;align-items:center;gap:8px;margin:3px 0;background:rgba(255,255,255,.05);border-radius:10px;padding:4px 8px}
  .up .nm{flex:1} .up .lv{color:var(--muted);font-size:11px} .up .eff{font-size:11px;color:var(--muted);white-space:nowrap}
  .up .btn{padding:5px 10px;font-size:12px}
  #summary .actions{display:flex;justify-content:center;margin-top:10px;padding-bottom:2px}
  ::-webkit-scrollbar{width:6px} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}

  /* ---------- Banner / toast / help ---------- */
  #banner{position:absolute;left:50%;top:150px;transform:translateX(-50%);pointer-events:none;text-align:center;opacity:0;
    transition:opacity .25s;z-index:40}
  #banner .t{font-size:34px;font-weight:800;letter-spacing:.5px;text-shadow:0 0 18px rgba(93,214,255,.8),0 2px 6px #000}
  #banner .s{font-size:15px;color:#dcd2ff;text-shadow:0 1px 4px #000}
  #banner.show{opacity:1}
  #toast{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);background:rgba(20,12,50,.92);border:1px solid rgba(255,180,162,.45);
    color:#ffd9cf;border-radius:10px;padding:6px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:45}
  #toast.show{opacity:1}
  #help{position:absolute;left:22px;bottom:48px;color:var(--muted);font-size:11px;pointer-events:none;line-height:1.5;
    background:rgba(12,8,36,.55);padding:4px 8px;border-radius:8px}
  #help b{color:#fff;font-weight:600}

  /* ---------- Daily goal + investor confidence ---------- */
  #goalChip{min-width:150px}
  #goalBar{position:relative;height:7px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-top:4px}
  #goalBar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ff7a59,#ffd166);transition:width .25s}
  #goalBar u{position:absolute;top:-2px;width:2px;height:11px;background:#fff;opacity:.75}
  #goalChip .gv{display:flex;align-items:baseline;gap:5px;justify-content:space-between}
  #goalChip .gv b{font-size:15px} #goalChip .gv span{font-size:11px;color:var(--muted)}
  #confWrap{display:flex;align-items:center;gap:5px;margin-top:5px}
  #confWrap .cb{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
  #confWrap .cb i{display:block;height:100%;background:linear-gradient(90deg,#5dd6ff,#c86bff);transition:width .4s}
  #confWrap span{font-size:10px;color:var(--muted);white-space:nowrap}
  .stars{letter-spacing:1px;color:#ffd166;text-shadow:0 0 8px rgba(255,209,102,.6)}
  .stars i{opacity:.22;font-style:normal}
  .stars i.on{opacity:1}

  /* ---------- Event banner strip ---------- */
  #evtStrip{position:absolute;left:50%;top:96px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:none;z-index:6}
  .evtTag{display:flex;align-items:center;gap:6px;background:rgba(12,8,36,.88);border:1px solid;border-radius:11px;padding:4px 10px;
    font-size:12px;font-weight:600;animation:popin .18s ease-out;white-space:nowrap}
  .evtTag .ring{width:13px;height:13px;border-radius:50%;border:2px solid;border-right-color:transparent;animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Start / continue gate ---------- */
  #gate{position:absolute;inset:0;background:rgba(6,4,20,.82);backdrop-filter:blur(5px);z-index:60;display:flex;
    align-items:center;justify-content:center;pointer-events:auto}
  #gate .card{background:var(--panel2);border:1px solid rgba(93,214,255,.4);border-radius:18px;padding:26px 30px;text-align:center;
    box-shadow:0 20px 70px rgba(0,0,0,.7);max-width:430px}
  #gate h1{margin:0 0 4px;font-size:30px;letter-spacing:1px}
  #gate p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.5}
  #gate .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #gate .best{margin-top:12px;font-size:12px;color:var(--gold)}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="world">
      <canvas id="game" width="1280" height="760"></canvas>
      <div id="dragGhost" class="hidden"></div>
      <div id="menu" class="popup hidden"></div>
    </div>

    <div id="ui">
    <div id="hud">
      <div id="hudRight">
        <div class="chip" id="dayChip"><small id="phaseLbl">בוקר</small><b id="dayLbl">יום 1 / 7</b></div>
        <div class="chip" id="money"><small>קופה</small><b id="moneyLbl">₪ 0</b></div>
      </div>
      <div id="hudCenter">
        <div id="timerWrap">
          <svg viewBox="0 0 64 64" width="64" height="64">
            <circle cx="32" cy="32" r="27" fill="rgba(12,8,36,.7)" stroke="rgba(255,255,255,.1)" stroke-width="5"/>
            <circle id="timerArc" cx="32" cy="32" r="27" fill="none" stroke="#5dd6ff" stroke-width="5" stroke-linecap="round"
                    stroke-dasharray="169.6" stroke-dashoffset="0" style="filter:drop-shadow(0 0 4px #5dd6ff)"/>
          </svg>
          <div class="n" id="timerLbl">90</div>
        </div>
        <button class="btn" id="openBtn">פותחים</button>
        <button class="btn ghost" id="speedBtn" title="מהירות היום">×1</button>
      </div>
      <div id="hudLeft">
        <div class="chip" id="goalChip">
          <small>יעד היום</small>
          <div class="gv"><b id="goalNow">₪ 0</b><span id="goalTarget">/ ₪ 0</span></div>
          <div id="goalBar"><i style="width:0%"></i><u id="mk1"></u><u id="mk2"></u></div>
          <div id="confWrap"><span>אמון</span><div class="cb"><i id="confBar" style="width:50%"></i></div><span id="confLbl">50</span></div>
        </div>
        <div class="chip"><small>עובדים פעילים</small><b id="slotsLbl">0 / 2</b></div>
        <div class="chip"><small>החלפות היום</small><b class="dots" id="movesDots"></b></div>
        <div class="chip"><small>המחשב שלי</small><b class="dots" id="pcDots"></b></div>
      </div>
    </div>

    <div id="evtStrip"></div>
    <div id="tray"></div>
    <div id="summary" class="hidden"></div>
    <div id="banner"><div class="t"></div><div class="s"></div></div>
    <div id="toast"></div>
    <div id="help"><b>WASD / חצים</b> תנועה · <b>רווח</b> פעולה · <b>Esc</b> סגירה · גרירה מהמגש = קיצור</div>
    </div>

    <div id="gate"><div class="card">
      <h1>STARTUPKID</h1>
      <p id="gateMsg">אתה סטארטמון. זה המשרד שלך.<br>בחר מי עובד היום ואיפה, פתח את העסק, והישאר בתוך המשרד בזמן שהצוות עובד.</p>
      <div class="btns" id="gateBtns"></div>
      <div class="best" id="gateBest"></div>
    </div></div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================================
   CONFIG — כל מספר משחקי נמצא כאן. אין מספרי איזון מפוזרים בקוד.
   ===================================================================================== */
const CONFIG = {
  totalDays: 7,
  dayDuration: 90,               // שניות של יום עבודה (זמן משחק במהירות ×1)
  fastForwardMultiplier: 3,      // מהירות היום כשלוחצים ×3

  movementSpeed: 250,            // מהירות השחקן (פיקסלים בשנייה)
  interactionDistance: 66,       // מרחק שבו מופיע "רווח · ..."

  workerBaseOutput: 1.0,         // מכפיל בסיס לכל עובד (₪ לשנייה × ערך התחנה)

  fatigueRate: 0.50,             // נקודות עייפות לשנייה בעבודה (יום מלא ≈ 45 מתוך 100)
  fatigueMaxPenalty: 0.6,        // בעייפות 100 התפוקה יורדת ב־60%
  overnightRecovery: 24,         // התאוששות לכל עובד בלילה (עובד רצוף מצטבר ≈ +21 ליום)
  restRecovery: 0.60,            // התאוששות לשנייה על הספה (יום מנוחה ≈ 54)
  benchRecovery: 0.12,           // התאוששות לשנייה על הספסל (חלשה בהרבה מהספה)

  xpRate: 0.8,                   // XP לשנייה בעבודה
  xpThresholds: [90, 240],       // XP נדרש לרמה 2 ולרמה 3

  ironManFatigueMultiplier: [0.5, 0.4, 0.3],   // איש ברזל: מכפיל עייפות לפי רמה
  growthStartMultiplier: 0.6,                  // צמיחה: תפוקה בתחילת היום
  growthMaxMultiplier: [1.6, 1.8, 2.0],        // צמיחה: תפוקה מקסימלית לפי רמה
  growthRampDuration: 50,                      // צמיחה: שניות עד למקסימום
  steadyHandLevelMultipliers: [1.0, 1.1, 1.2], // יד יציבה: תפוקת בסיס לפי רמה
  sparkTeamMultiplier: [1.15, 1.2, 1.25],      // ניצוץ: מכפיל לכל שאר העובדים הפעילים
  mentorXpMultiplier: [1.5, 1.75, 2.0],        // מנטור: מכפיל XP לכל שאר העובדים

  sparkPulseInterval: 4,         // שניות בין פולסי ניצוץ (ויזואלי)
  mentorPulseInterval: 4.5,      // שניות בין גלי מנטור (ויזואלי)
  moneyPopInterval: 1.1,         // שניות בין הקפצות ₪ מעל עובד

  stations: {
    // חזק עכשיו → יקר וגדל לאט | חלש עכשיו → זול וגדל מהר.
    // ר1: מכירות 1.70 > מוצר 1.40 > מחקר 1.10 > שיווק 0.80
    // ר3: שיווק 2.48 > מוצר 2.38 > מחקר 2.26 > מכירות 2.21  (הסדר מתהפך)
    sales:     { baseValue: 1.7, upgradeCosts: [300, 700], upgradeMultipliers: [1.0, 1.15, 1.30] },
    product:   { baseValue: 1.4, upgradeCosts: [240, 560], upgradeMultipliers: [1.0, 1.35, 1.70] },
    marketing: { baseValue: 0.8, upgradeCosts: [150, 380], upgradeMultipliers: [1.0, 1.90, 3.10] },
    research:  { baseValue: 1.1, upgradeCosts: [190, 460], upgradeMultipliers: [1.0, 1.55, 2.05] },
  },

  rosterUnlockDays: { iron: 1, nature: 1, stone: 1, crystal: 3, spiky: 5 },
  activeSlots: [2, 2, 3, 3, 4, 4, 4],   // משבצות עבודה פעילות לפי יום (יום 1 = אינדקס 0)
  restCapacity: 1,
  midDayMoves: 2,

  founderComputer: {
    usesPerDay: 3,        // כמה פעמים ביום אפשר לעבוד במחשב
    cooldown: 20,         // שניות בין שימושים
    boostDuration: 15,    // כמה זמן הבוסט פעיל
    boostMultiplier: 1.2, // +20% לתחנה שנבחרה
  },

  startingMoney: 0,

  // ----- מצלמה: zoom:1 + follow:false מחזיר בדיוק לתצוגה הקבועה הישנה -----
  camera: {
    zoom: 1.10,          // כמה מתקרבים למשרד (גבוה מדי חותך את קצוות המשרד)
    follow: true,        // האם המצלמה עוקבת אחרי השחקן
    followSpeed: 2.6,    // כמה מהר היא מדביקה אותו (גבוה = צמוד יותר)
    deadZone: 120,       // אזור במרכז שבו תנועה קטנה לא מזיזה את המצלמה
    shakeOnLevelUp: 6,   // עוצמת רעידה בעליית רמה
    shakeOnEvent: 4,     // עוצמת רעידה בסיום אירוע
    shakeOnDayEnd: 7,

const $ = id => document.getElementById(id);
const canvas = $('game');
let ctx = canvas.getContext('2d');
const bg = document.createElement('canvas'), bgx = bg.getContext('2d');
const stage = $('stage'), world = $('world');
let scale = 1;

/* ---------- camera ----------
   #world is transformed as: translate(W/2,H/2) scale(z) translate(-cam.x,-cam.y)
   so the world point (cam.x, cam.y) always lands in the middle of the stage.     */
const cam = { x: W / 2, y: H / 2, z: CONFIG.camera.zoom, tx: W / 2, ty: H / 2,
              shakeT: 0, shakeDur: 1, shakeMag: 0, punchT: 0, punchDur: 1, punchMag: 0 };
const camShake = (mag, dur = .32) => { cam.shakeMag = Math.max(cam.shakeMag, mag); cam.shakeT = cam.shakeDur = dur; };
const camPunch = (mag, dur = .3) => { cam.punchMag = mag; cam.punchT = cam.punchDur = dur; };
// keep the view inside the room: never show anything past the walls
function clampCam(x, y, z) { const hw = W / (2 * z), hh = H / (2 * z); return { x: clamp(x, hw, W - hw), y: clamp(y, hh, H - hh) }; }

function updateCamera(dt) {
  const C = CONFIG.camera;
  if (C.follow) {
    const p = state.player;
    // dead zone: small steps near the middle do not drag the camera around
    if (Math.abs(p.x - cam.tx) > C.deadZone) cam.tx = p.x - Math.sign(p.x - cam.tx) * C.deadZone;
    if (Math.abs(p.y - cam.ty) > C.deadZone) cam.ty = p.y - Math.sign(p.y - cam.ty) * C.deadZone;
  } else { cam.tx = W / 2; cam.ty = H / 2; }
  let z = C.zoom;
  if (cam.punchT > 0) { cam.punchT = Math.max(0, cam.punchT - dt); z *= 1 + cam.punchMag * Math.sin(Math.PI * (cam.punchT / cam.punchDur)); }
  cam.z = lerp(cam.z, z, 1 - Math.exp(-12 * dt));
  const t = clampCam(cam.tx, cam.ty, cam.z);
  const k = 1 - Math.exp(-C.followSpeed * dt);
  const c = clampCam(lerp(cam.x, t.x, k), lerp(cam.y, t.y, k), cam.z);
  cam.x = c.x; cam.y = c.y;
  if (cam.shakeT > 0) cam.shakeT = Math.max(0, cam.shakeT - dt); else cam.shakeMag = 0;
  applyCamera();
}
function applyCamera() {
  let ox = 0, oy = 0;
  if (cam.shakeT > 0) { const f = cam.shakeMag * (cam.shakeT / cam.shakeDur); ox = (Math.random() * 2 - 1) * f; oy = (Math.random() * 2 - 1) * f; }
  world.style.transform = `translate(${W / 2 + ox}px, ${H / 2 + oy}px) scale(${cam.z}) translate(${-cam.x}px, ${-cam.y}px)`;
}
// the visible slice of the world right now, used to keep popups on screen
function viewRect() { const hw = W / (2 * cam.z), hh = H / (2 * cam.z); return { x: cam.x - hw, y: cam.y - hh, w: hw * 2, h: hh * 2 }; }

function layout() {
  const vw = innerWidth, vh = innerHeight;
  scale = Math.min(vw / W, vh / H);
  stage.style.transform = `scale(${scale})`;
  stage.style.left = ((vw - W * scale) / 2) + 'px';
  stage.style.top = ((vh - H * scale) / 2) + 'px';
  const dpr = Math.min(devicePixelRatio || 1, 2);
  // render at camera zoom too, so the zoomed-in office stays sharp
  const k = scale * Math.max(1, CONFIG.camera.zoom) * dpr;
  canvas.width = Math.round(W * k); canvas.height = Math.round(H * k);
  canvas._k = k;
  buildStaticLayer();
  applyCamera();
}
addEventListener('resize', layout); layout();

// screen -> world, accounting for both the stage fit-scale and the camera
function toWorld(e) {
  const r = stage.getBoundingClientRect();
  const sx = (e.clientX - r.left) / scale, sy = (e.clientY - r.top) / scale;
  return { x: (sx - W / 2) / cam.z + cam.x, y: (sy - H / 2) / cam.z + cam.y };
}

/* ASSIGNMENT LOGIC (shared by menu + drag/drop) */
function activeSlots() { return CONFIG.activeSlots[state.day - 1]; }
function workingCount() { return state.workers.filter(w => w.unlocked && isStation(w.assignment)).length; }
function occupant(target) { return state.workers.find(w => w.unlocked && w.assignment === target); }

function canAssign(w, target) {
  if (state.phase === 'summary' || state.phase === 'end') return { ok: false, reason: 'העסק סגור' };
  if (target === w.assignment) return { ok: false, reason: 'כבר שם' };
  // מהספסל אפשר להיכנס לעבודה בלי לבזבז החלפה — זה מה שנותן לספסל תפקיד
  const freeSwap = CONFIG.benchSwapIsFree && w.assignment === 'bench' && isStation(target);
  if (state.phase === 'work' && state.movesLeft <= 0 && !freeSwap) return { ok: false, reason: 'נגמרו ההחלפות להיום' };
  // מי שעל הספה באמת נח — אי אפשר לשלוף אותו מיד
  if (state.phase === 'work' && w.assignment === 'rest' && w.restLock > 0) return { ok: false, reason: `עוד ${Math.ceil(w.restLock)} ש׳ מנוחה` };
  if (isStation(target)) {
    const occ = occupant(target);
    if (occ) return { ok: false, reason: `תפוס · ${occ.name}` };
    if (!isStation(w.assignment) && workingCount() >= activeSlots()) return { ok: false, reason: 'אין משבצת פנויה' };
  }
  if (target === 'rest') {
    const resting = state.workers.filter(x => x.unlocked && x.assignment === 'rest').length;
    if (resting >= CONFIG.restCapacity) return { ok: false, reason: `הספה תפוסה · ${occupant('rest').name}` };
  }
  return { ok: true };
}

function assign(w, target, source) {
  const c = canAssign(w, target);
  if (!c.ok) { toast(c.reason); return false; }
  const wasStation = isStation(w.assignment), wasBench = w.assignment === 'bench';
  w.assignment = target;
  w.restLock = target === 'rest' ? CONFIG.restLockSeconds : 0;
  if (state.phase === 'work') {
    const freeSwap = CONFIG.benchSwapIsFree && wasBench && isStation(target);
    if (!freeSwap) state.movesLeft--; else toast(`${w.name} נכנס מהספסל — בלי לבזבז החלפה`, false);
    w.movedMidday = true;
    if (w.kind === 'nature' && (wasStation || isStation(target))) { w.growth = 0; state.dayStats.natureMoved = true; addEffect({ type: 'wilt', x: w.x, y: w.y - 40, t: 0, dur: 1 }); }
    if (isStation(target)) w.popAcc = 0;
  }
  if (w.kind === 'nature' && state.phase === 'morning') w.growth = 0;
  placeWorker(w);
  addEffect({ type: 'assignRing', x: w.tx, y: w.ty, t: 0, dur: .6, color: isStation(target) ? STATIONS[target].accent : (target === 'rest' ? '#ffd166' : '#a79ad0') });
  toast(`${w.name} ← ${ASSIGN_NAMES[target]}`, false);
  updateHUD(); renderTray();
  return true;
}

function placeWorker(w) {
  if (isStation(w.assignment)) { w.tx = STATIONS[w.assignment].spot.x; w.ty = STATIONS[w.assignment].spot.y; }
  else if (w.assignment === 'rest') { w.tx = SOFA.spot.x; w.ty = SOFA.spot.y; }
  else { const i = state.workers.filter(x => x.unlocked && x.assignment === 'bench').indexOf(w); const s = BENCH.spots[Math.max(0, i)]; w.tx = s.x; w.ty = s.y; }
  // re-pack the bench spots so nobody overlaps
  state.workers.filter(x => x.unlocked && x.assignment === 'bench').forEach((x, i) => { x.tx = BENCH.spots[i].x; x.ty = BENCH.spots[i].y; });
}

function startDay(day) {
  state.day = day; state.phase = 'morning'; state.time = 0; state.speed = 1;
  state.movesLeft = CONFIG.midDayMoves;
  state.founder.usesLeft = CONFIG.founderComputer.usesPerDay; state.founder.cooldown = 0; state.founder.boost = null;
  state.dayStats = newDayStats();
  state.player.x = 140; state.player.y = 330; state.player.facing = 1;
  const newcomers = [];
  for (const w of state.workers) {
    w.workedToday = w.restedToday = w.movedMidday = false; w.growth = 0; w.popAcc = 0; w.rate = 0;
    if (!w.unlocked && CONFIG.rosterUnlockDays[w.id] <= day) {
      w.unlocked = true;
      if (day > 1) { newcomers.push(w); w.x = DOOR.x - 10; w.y = DOOR.y + DOOR.h / 2; }
    }
    if (w.unlocked) w.assignment = 'bench';
  }
  state.events = []; state.evtTimer = CONFIG.events.firstAt; renderEventStrip();
  state.workers.filter(w => w.unlocked).forEach(placeWorker);
  for (const w of state.workers) if (w.unlocked && !newcomers.includes(w)) { w.x = w.tx; w.y = w.ty; }
  closeMenu(); $('summary').classList.add('hidden');
  $('openBtn').classList.remove('hidden');
  if (newcomers.length) {
    const n = newcomers[0];
    banner(`מצטרף לצוות: ${n.name}`, `${n.type} · ${n.ability} — ${n.desc}`, 3.2);
    setTimeout(() => addEffect({ type: 'unlock', x: n.tx, y: n.ty - 24, t: 0, dur: 1.4, color: n.color }), 900);
    setTimeout(() => banner(`יום ${day} · בוקר`, `${activeSlots()} משבצות עבודה היום · בחר מי עובד ואיפה`, 2.6), 3500);
  } else {
    banner(`יום ${day} · בוקר`, day === 1 ? 'לך אל העובדים, לחץ רווח, ובחר איפה הם עובדים היום' : `${activeSlots()} משבצות עבודה · העייפות עברה מאתמול`, 3);
  }
  updateHUD(); renderTray();
}

function openBusiness() {
  if (state.phase !== 'morning') return;
  if (workingCount() === 0) toast('פתחת בלי אף עובד בעמדה — מותר, אבל לא ירוויחו הרבה');
  else if (workingCount() < activeSlots()) toast(`נפתח עם ${workingCount()} מתוך ${activeSlots()} משבצות`);
  state.phase = 'work'; state.time = 0; state.sparkTimer = 1; state.mentorTimer = 2.5;
  state.events = []; state.evtTimer = CONFIG.events.firstAt; renderEventStrip();
  $('openBtn').classList.add('hidden');
  banner('פותחים!', 'העסק פתוח · אפשר להסתובב, להחליף עובדים ולעבוד במחשב שלך', 2.2);
  addEffect({ type: 'openFlash', t: 0, dur: 1 });
  closeMenu(); updateHUD(); renderTray();
}

function endDay() {
  if (state.phase !== 'work') return;
  state.phase = 'summary'; state.founder.boost = null;
  state.events = []; renderEventStrip(); camShake(CONFIG.camera.shakeOnDayEnd);
  const ds = state.dayStats;
  for (const w of state.workers) if (w.unlocked) { ds.endFatigue[w.id] = w.fatigue; w.rate = 0; }
  ds.day = state.day;
  // יעד היום -> כוכבים -> אמון המשקיע. לחץ רך: אי אפשר להפסיד, אבל רואים בבירור איפה אתה עומד.
  const G = CONFIG.goals;
  ds.target = dayTarget(); ds.stars = starsFor(ds.total);
  state.confidence = clamp(state.confidence + G.confidencePerStar[ds.stars], 0, 100);
  ds.confidence = state.confidence;
  if (state.confidence >= G.bonusAtConfidence) { ds.bonus = G.bonusAmount; state.money += G.bonusAmount; }
  state.stars.push(ds.stars);
  state.totalEarned += ds.total;
  closeMenu();
  banner('היום נגמר', 'סוגרים · הנה הסיכום', 2);
  showSummary();
  updateHUD(); renderTray();
}

function dayTarget() { const T = CONFIG.goals.dailyTargets; return T[Math.min(state.day - 1, T.length - 1)]; }
function starsFor(income) { return CONFIG.goals.starThresholds.reduce((n, th) => n + (income >= dayTarget() * th ? 1 : 0), 0); }
function starsHtml(n) { let h = ''; for (let i = 0; i < 3; i++) h += `<i class="${i < n ? 'on' : ''}">★</i>`; return `<span class="stars">${h}</span>`; }

function nextDay() {
  for (const w of state.workers) if (w.unlocked) w.fatigue = Math.max(0, w.fatigue - CONFIG.overnightRecovery);
  state.history.push(state.dayStats); state.lastDayStats = state.dayStats;
  if (state.day >= CONFIG.totalDays) { state.phase = 'end'; state.bestScore = Math.max(state.bestScore || 0, state.totalEarned); saveGame(); showFinal(); return; }
  startDay(state.day + 1);
  saveGame();
}

function upgradeStation(id) {
  const lvl = state.stationLevels[id]; if (lvl >= 3) return;
  const cost = CONFIG.stations[id].upgradeCosts[lvl - 1];
  if (state.money < cost) { toast('אין מספיק כסף'); return; }
  state.money -= cost; state.stationLevels[id] = lvl + 1;
  state.dayStats.upgrades.push(id);
  const d = STATIONS[id].desk;
  addEffect({ type: 'upgrade', x: d.x + d.w / 2, y: d.y + d.h / 2, t: 0, dur: 1.2, color: STATIONS[id].accent });
  toast(`${STATIONS[id].name} שודרגה לרמה ${lvl + 1}`, false);
  camPunch(CONFIG.camera.punchOnEvent); saveGame();
  updateHUD(); showSummary();
}

function gainXp(w, amt) {
  if (w.level >= 3) return;
  w.xp += amt;
  const need = CONFIG.xpThresholds[w.level - 1];
  if (w.xp >= need) {
    w.xp -= need; w.level++; w.bump = 1;
    addEffect({ type: 'levelup', x: w.x, y: w.y, t: 0, dur: 1.4, text: `רמה ${w.level}!`, color: w.color });
    camShake(CONFIG.camera.shakeOnLevelUp); camPunch(CONFIG.camera.punchOnLevelUp);
    if (state.menu && state.menu.worker === w) openWorkerMenu(w);
  }
}

/* ===================================================================================== */
/* SIMULATION */
function simTick(dt) {
  const S = state; S.time += dt;
  const active = S.workers.filter(w => w.unlocked && isStation(w.assignment));
  const sparkW = active.find(w => w.kind === 'crystal');
  const mentorW = active.find(w => w.kind === 'spiky');
  for (const w of S.workers) {
    if (!w.unlocked) continue;
    if (isStation(w.assignment)) {
      const st = w.assignment, def = CONFIG.stations[st], lvl = S.stationLevels[st];
      const base = CONFIG.workerBaseOutput * def.baseValue * def.upgradeMultipliers[lvl - 1];
      let mod = 1;
      if (w.kind === 'nature') { w.growth = Math.min(1, w.growth + dt / CONFIG.growthRampDuration); mod *= lerp(CONFIG.growthStartMultiplier, CONFIG.growthMaxMultiplier[w.level - 1], w.growth); }
      if (w.kind === 'stone') mod *= CONFIG.steadyHandLevelMultipliers[w.level - 1];
      let sparkMul = 1;
      if (sparkW && sparkW !== w) { sparkMul = CONFIG.sparkTeamMultiplier[sparkW.level - 1]; mod *= sparkMul; }
      if (S.founder.boost && S.founder.boost.station === st) mod *= CONFIG.founderComputer.boostMultiplier;
      const fatPen = w.kind === 'stone' ? 1 : 1 - (w.fatigue / 100) * CONFIG.fatigueMaxPenalty;
      if (bugOn(st)) mod *= CONFIG.events.bug.outputPenalty;
      if (stuckOn(w)) mod *= CONFIG.events.stuck.outputPenalty;
      const rate = base * mod * fatPen, income = rate * dt;
      w.rate = rate;
      S.money += income; S.dayStats.total += income; S.dayStats.byStation[st] += income;
      S.dayStats.byWorker[w.id] = (S.dayStats.byWorker[w.id] || 0) + income;
      if (sparkMul > 1) S.dayStats.support[sparkW.id] = (S.dayStats.support[sparkW.id] || 0) + income * (1 - 1 / sparkMul);
      w.popAcc += income; w.popTimer += dt;
      if (w.popTimer >= CONFIG.moneyPopInterval && w.popAcc >= 1) {
        const boosted = S.founder.boost && S.founder.boost.station === st;
        addEffect({ type: 'pop', x: w.x + (Math.random() * 20 - 10), y: w.y - 58, t: 0, dur: 1.15, text: '₪' + Math.floor(w.popAcc), color: STATIONS[st].accent, size: boosted ? 20 : 16, bold: boosted });
        w.popAcc -= Math.floor(w.popAcc); w.popTimer = 0;
      }
      let fr = CONFIG.fatigueRate; if (w.kind === 'iron') fr *= CONFIG.ironManFatigueMultiplier[w.level - 1];
      w.fatigue = Math.min(100, w.fatigue + fr * dt);
      let xr = CONFIG.xpRate; if (mentorW && mentorW !== w) xr *= CONFIG.mentorXpMultiplier[mentorW.level - 1];
      if (xr > CONFIG.xpRate) S.dayStats.supportXp[mentorW.id] = (S.dayStats.supportXp[mentorW.id] || 0) + (xr - CONFIG.xpRate) * dt;
      gainXp(w, xr * dt);
      w.workedToday = true;
    } else if (w.assignment === 'rest') {
      w.fatigue = Math.max(0, w.fatigue - CONFIG.restRecovery * dt); w.restedToday = true; w.rate = 0;
      w.restLock = Math.max(0, w.restLock - dt);
    } else { w.fatigue = Math.max(0, w.fatigue - CONFIG.benchRecovery * dt); w.rate = 0; }
  }
  // founder computer timers
  const F = S.founder;
  if (F.cooldown > 0) F.cooldown = Math.max(0, F.cooldown - dt);
  if (F.boost) { F.boost.left -= dt; if (F.boost.left <= 0) F.boost = null; }
  // ability pulses (visual)
  S.sparkTimer -= dt;
  if (S.sparkTimer <= 0) {
    S.sparkTimer = CONFIG.sparkPulseInterval;
    if (sparkW) for (const o of active) if (o !== sparkW) addEffect({ type: 'shard', from: { x: sparkW.x, y: sparkW.y - 30 }, to: { x: o.x, y: o.y - 28 }, t: 0, dur: .45, color: '#6ff0ff', target: o });
  }
  S.mentorTimer -= dt;
  if (S.mentorTimer <= 0) {
    S.mentorTimer = CONFIG.mentorPulseInterval;
    if (mentorW && active.length > 1) addEffect({ type: 'ring', x: mentorW.x, y: mentorW.y - 24, t: 0, dur: 1.7, maxR: 420, hits: new Set([mentorW.id]), color: '#ffa63f' });
  }
  S.zTimer -= dt;
  if (S.zTimer <= 0) { S.zTimer = 1.4; const r = occupant('rest'); if (r) addEffect({ type: 'z', x: r.x + 14, y: r.y - 46, t: 0, dur: 1.6 }); }
  updateEvents(dt);
  if (S.time >= CONFIG.dayDuration) endDay();
}

/* FOUNDER COMPUTER */
function founderCanUse() {
  const F = state.founder, C = CONFIG.founderComputer;
  if (state.phase !== 'work') return { ok: false, reason: 'המחשב עובד רק כשהעסק פתוח' };

  if (F.boost) return { ok: false, reason: `הבוסט על ${STATIONS[F.boost.station].name} עדיין פעיל` };
  return { ok: true };
}
function founderFocus(stationId) {

}

/* ===================================================================================== */
/* LIVE EVENTS — משהו קורה כל הזמן, וצריך להגיע פיזית ולטפל בו */
const EVENT_DEFS = {
  client: { name: 'לקוח גדול!', hint: 'רווח · לענות', color: '#ffd166', bad: false },
  bug:    { name: 'באג בתחנה',  hint: 'רווח · לתקן',  color: '#ff5f6d', bad: true },
  stuck:  { name: 'עובד נתקע',  hint: 'רווח · לעזור', color: '#c86bff', bad: true },
  idea:   { name: 'רעיון מבריק', hint: 'דרוך עליו',   color: '#7dffb0', bad: false, walkOver: true },
  coffee: { name: 'קפה מוכן',   hint: 'רווח · להגיש', color: '#5dd6ff', bad: false },
};
const bugOn = st => state.events.find(e => e.type === 'bug' && e.station === st);
const stuckOn = w => state.events.find(e => e.type === 'stuck' && e.worker === w);
const eventPos = e => e.worker ? { x: e.worker.x, y: e.worker.y - 78 } : { x: e.x, y: e.y };

function spawnEvent() {
  const E = CONFIG.events;
  if (state.events.length >= E.maxActive) return;
  const active = state.workers.filter(w => w.unlocked && isStation(w.assignment));
  if (!active.length) return;
  const free = t => !state.events.some(e => e.type === t);
  const badActive = state.events.filter(e => EVENT_DEFS[e.type].bad).length >= CONFIG.events.maxActiveBad;
  const cand = [];
  // each type only offers itself when it would actually mean something
  const withStation = active.filter(w => !bugOn(w.assignment));
  if (withStation.length && free('client')) cand.push('client');              // pure opportunity
  const tech = active.filter(w => (w.assignment === 'product' || w.assignment === 'research') && !bugOn(w.assignment));
  if (tech.length && !badActive) cand.push('bug');
  const unstuck = active.filter(w => !stuckOn(w));
  if (unstuck.length && !badActive) cand.push('stuck');
  cand.push('idea', 'idea');                                                  // always available, rewards walking
  const tired = state.workers.filter(w => w.unlocked && w.fatigue > 25);
  if (tired.length && free('coffee')) cand.push('coffee');
  const type = cand[(Math.random() * cand.length) | 0];

  const ev = { type, t: 0, dur: E.duration, id: Math.random() };
  if (type === 'client') { const w = withStation[(Math.random() * withStation.length) | 0]; ev.station = w.assignment; const sp = STATIONS[ev.station].spot; ev.x = sp.x; ev.y = sp.y - 74; }
  else if (type === 'bug') { const w = tech[(Math.random() * tech.length) | 0]; ev.station = w.assignment; const d = STATIONS[ev.station].desk; ev.x = d.x + d.w / 2; ev.y = d.y + d.h / 2; }
  else if (type === 'stuck') { ev.worker = unstuck[(Math.random() * unstuck.length) | 0]; ev.station = ev.worker.assignment; }
  else if (type === 'coffee') { ev.x = COOLER.x + COOLER.w / 2; ev.y = COOLER.y - 16; }
  else { // idea: a walkable spot away from the player so it is worth the trip
    for (let i = 0; i < 30; i++) {
      const x = FLOOR.x + 70 + Math.random() * (FLOOR.w - 140), y = FLOOR.y + 90 + Math.random() * (FLOOR.h - 160);
      if (OBSTACLES.some(o => x > o.x - 26 && x < o.x + o.w + 26 && y > o.y - 26 && y < o.y + o.h + 26)) continue;
      if (dist({ x, y }, state.player) < 190) continue;
      ev.x = x; ev.y = y; break;
    }
    if (ev.x === undefined) return;
  }
  state.events.push(ev);
  addEffect({ type: 'evtSpawn', x: eventPos(ev).x, y: eventPos(ev).y, t: 0, dur: .6, color: EVENT_DEFS[type].color });
  renderEventStrip();
}

function resolveEvent(ev) {
  const i = state.events.indexOf(ev); if (i < 0) return;
  state.events.splice(i, 1);
  const E = CONFIG.events, d = EVENT_DEFS[ev.type], p = eventPos(ev);
  let msg = '';
  if (ev.type === 'client') {
    const amt = E.client.bonus + E.client.bonusPerDay * (state.day - 1);
    state.money += amt; state.dayStats.total += amt; state.dayStats.byStation[ev.station] += amt;
    state.dayStats.eventIncome += amt;
    addEffect({ type: 'pop', x: p.x, y: p.y, t: 0, dur: 1.5, text: '₪' + amt, color: '#ffd166', size: 26, bold: true });
    msg = `לקוח נסגר · +${fmt(amt)}`;
  } else if (ev.type === 'bug') { msg = 'הבאג תוקן'; }
  else if (ev.type === 'stuck') { ev.worker.bump = 1; msg = `${ev.worker.name} חזר לעבוד`; }
  else if (ev.type === 'idea') {
    const act = state.workers.filter(w => w.unlocked && isStation(w.assignment));
    act.forEach(w => { gainXp(w, E.idea.xpBurst); addEffect({ type: 'xpfloat', x: w.x - 14, y: w.y - 62, t: 0, dur: 1.3 }); });
    msg = `רעיון! +${E.idea.xpBurst} XP לכל עובד פעיל`;
  } else if (ev.type === 'coffee') {
    const tired = state.workers.filter(w => w.unlocked).sort((a, b) => b.fatigue - a.fatigue)[0];
    if (tired) { tired.fatigue = Math.max(0, tired.fatigue - E.coffee.fatigueRelief); tired.bump = 1;
      addEffect({ type: 'pop', x: tired.x, y: tired.y - 64, t: 0, dur: 1.3, text: `−${E.coffee.fatigueRelief} עייפות`, color: '#5dd6ff', size: 15 });
      msg = `${tired.name} קיבל קפה`; }
  }
  state.dayStats.eventsHandled++;
  addEffect({ type: 'burst', x: p.x, y: p.y, t: 0, dur: .55, color: d.color, r: 46, rays: 12 });
  camShake(CONFIG.camera.shakeOnEvent); camPunch(CONFIG.camera.punchOnEvent);
  if (msg) toast(msg, false);
  renderEventStrip();
}

function updateEvents(dt) {
  if (state.phase !== 'work') return;
  state.evtTimer -= dt;
  if (state.evtTimer <= 0) { spawnEvent(); const E = CONFIG.events; state.evtTimer = E.interval + (Math.random() * 2 - 1) * E.intervalJitter; }
  for (let i = state.events.length - 1; i >= 0; i--) {
    const ev = state.events[i];
    ev.t += dt;
    // the lightbulb is picked up just by walking over it — no key press
    if (EVENT_DEFS[ev.type].walkOver && dist(state.player, { x: ev.x, y: ev.y }) < 34) { resolveEvent(ev); continue; }
    // a worker moved off the station the event belongs to: the event stops making sense
    if (ev.worker && !isStation(ev.worker.assignment)) { state.events.splice(i, 1); renderEventStrip(); continue; }
    if (ev.station && !occupant(ev.station)) { state.events.splice(i, 1); renderEventStrip(); continue; }
    if (ev.t >= ev.dur) { state.events.splice(i, 1); state.dayStats.eventsMissed++; if (EVENT_DEFS[ev.type].bad) toast(`${EVENT_DEFS[ev.type].name} — נגמר הזמן`); renderEventStrip(); }
  }
}

function renderEventStrip() {
  const el = $('evtStrip');
  el.innerHTML = state.events.filter(e => !EVENT_DEFS[e.type].walkOver).map(e => {
    const d = EVENT_DEFS[e.type];
    return `<div class="evtTag" style="border-color:${d.color}88;color:${d.color}"><span class="ring" style="border-color:${d.color};border-right-color:transparent"></span>${d.name}</div>`;
  }).join('');
}

/* ===================================================================================== */
/* INTERACTION + MENUS */
function findTarget() {
  const p = state.player; let best = null, bd = CONFIG.interactionDistance, bs = Infinity;
  // score from an aim point just in front of the player, so facing steers the pick in a crowd
  const ax = p.x + p.facing * 26, ay = p.y;
  for (const w of state.workers) if (w.unlocked) {
    const d = dist(p, w); if (d >= CONFIG.interactionDistance) continue;
    const score = Math.hypot(w.x - ax, w.y - ay);
    if (score < bs) { bs = score; bd = d; best = { type: 'worker', w }; }
  }
  const fd = FOUNDER.desk, cx = clamp(p.x, fd.x, fd.x + fd.w), cy = clamp(p.y, fd.y, fd.y + fd.h);
  const dfo = Math.hypot(p.x - cx, p.y - cy);
  if (dfo < CONFIG.interactionDistance - 20 && dfo < bd) best = { type: 'founder' };
  // an event nearby always takes priority — it is the thing shouting for attention
  for (const ev of state.events) {
    if (EVENT_DEFS[ev.type].walkOver) continue;
    const q = eventPos(ev), d = Math.hypot(p.x - q.x, p.y - (q.y + 40));
    if (d < CONFIG.interactionDistance + 14) { best = { type: 'event', ev }; break; }
  }
  return best;
}
function onInteract() {
  if (state.menu) { closeMenu(); return; }
  const t = state.target; if (!t) return;
  if (t.type === 'event') { resolveEvent(t.ev); state.target = null; return; }
  if (t.type === 'worker') openWorkerMenu(t.w); else openFounderMenu();
}
function positionPopup(el, x, y) {
  el.classList.remove('hidden');
  const w = el.offsetWidth || 236, h = el.offsetHeight || 200;
  const v = viewRect();
  // open on whichever side has room inside the current view
  let left = (x - v.x < v.w / 2) ? x + 44 : x - 44 - w;
  left = clamp(left, v.x + 10, v.x + v.w - w - 10);
  const top = clamp(y - h / 2 - 20, v.y + 78, v.y + v.h - h - 46);
  el.style.left = left + 'px'; el.style.top = top + 'px';
}
function pips(n, max, color) { let s = ''; for (let i = 0; i < max; i++) s += `<i style="display:inline-block;width:7px;height:7px;border-radius:2px;margin-inline-start:2px;background:${i < n ? color : 'rgba(255,255,255,.15)'}"></i>`; return s; }
function fatColor(f) { return f < 40 ? '#7dffb0' : f < 70 ? '#ffd166' : '#ff7a59'; }

function openWorkerMenu(w) {
  state.menu = { type: 'worker', worker: w };
  const el = $('menu');
  const need = w.level < 3 ? CONFIG.xpThresholds[w.level - 1] : 1;

    if (isStation(t)) { const lv = state.stationLevels[t]; sub = `רמה ${lv} · ${(CONFIG.stations[t].baseValue * CONFIG.stations[t].upgradeMultipliers[lv - 1]).toFixed(1)}/ש׳`; }
    if (!c.ok && !cur) sub = c.reason;
    if (cur) sub = 'כאן עכשיו';
    const col = isStation(t) ? STATIONS[t].accent : (t === 'rest' ? '#ffd166' : '#a79ad0');
    opts += `<button class="opt ${cur ? 'cur' : ''}" data-t="${t}" ${c.ok ? '' : 'disabled'} style="border-color:${col}55"><span class="k">${i + 1}</span><span style="color:${col}">${ASSIGN_NAMES[t]}</span><small>${sub}</small></button>`;
  });

  el.innerHTML = `
    <div class="ph"><b>${w.name}</b><span class="type">${w.type}</span></div>
    <div class="ability"><b>${w.ability}</b> · ${w.desc}<br><span style="color:var(--muted)">${abilityLvl}</span></div>

    <div class="stat">עייפות <div class="bar"><i style="width:${w.fatigue}%;background:${fatColor(w.fatigue)}"></i></div><span>${Math.round(w.fatigue)}</span></div>
    <div class="opts">${opts}</div>

  el.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (assign(w, b.dataset.t, 'menu')) closeMenu(); });

function abilityLevelText(w) {

function openFounderMenu() {

  });
  el.innerHTML = `

function dots(n, max) { let s = ''; for (let i = 0; i < max; i++) s += `<i class="${i < n ? '' : 'off'}"></i>`; return s; }

function renderTray() {

  for (const w of state.workers) if (w.unlocked) {

let bannerT = null;
function banner(t, s, secs) { const b = $('banner'); b.querySelector('.t').textContent = t; b.querySelector('.s').textContent = s || ''; b.classList.add('show'); clearTimeout(bannerT); bannerT = setTimeout(() => b.classList.remove('show'), secs * 1000); }
let toastT = null;
function toast(msg, warn = true) { const t = $('toast'); t.textContent = msg; t.style.borderColor = warn ? 'rgba(255,180,162,.5)' : 'rgba(125,255,176,.5)'; t.style.color = warn ? '#ffd9cf' : '#d8ffe6'; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

/* UPDATE LOOP */
function addEffect(e) { state.effects.push(e); }

function updatePlayer(dt) {
  const p = state.player;
  let dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  const len = Math.hypot(dx, dy); if (len > 0) { dx /= len; dy /= len; }
  const acc = 14;
  p.vx = lerp(p.vx, dx * CONFIG.movementSpeed, 1 - Math.exp(-acc * dt));
  p.vy = lerp(p.vy, dy * CONFIG.movementSpeed, 1 - Math.exp(-acc * dt));
  if (Math.abs(p.vx) < 2) p.vx = 0; if (Math.abs(p.vy) < 2) p.vy = 0;
  p.moving = len > 0; if (dx !== 0) p.facing = dx > 0 ? 1 : -1;
  state.idle = (p.moving || state.menu) ? 0 : state.idle + dt;
  const box = { w: 26, h: 14 };
  const hits = (x, y) => {
    const bx = x - box.w / 2, by = y - box.h;
    if (bx < FLOOR.x || bx + box.w > FLOOR.x + FLOOR.w || by < FLOOR.y + 4 || y > FLOOR.y + FLOOR.h - 2) return true;
    for (const o of OBSTACLES) if (bx < o.x + o.w && bx + box.w > o.x && by < o.y + o.h && by + box.h > o.y) return true;
    return false;
  };
  const nx = p.x + p.vx * dt; if (!hits(nx, p.y)) p.x = nx; else p.vx = 0;
  const ny = p.y + p.vy * dt; if (!hits(p.x, ny)) p.y = ny; else p.vy = 0;

  if (state.menu) {
    const m = state.menu;
    const far = m.type === 'worker' ? dist(p, m.worker) > CONFIG.interactionDistance * 1.6 : Math.hypot(p.x - clamp(p.x, FOUNDER.desk.x, FOUNDER.desk.x + FOUNDER.desk.w), p.y - clamp(p.y, FOUNDER.desk.y, FOUNDER.desk.y + FOUNDER.desk.h)) > CONFIG.interactionDistance;
    if (far) closeMenu();
  }
}
function updateWorkers(dt) {
  for (const w of state.workers) {
    if (!w.unlocked) continue;
    const d = dist(w, { x: w.tx, y: w.ty });
    if (d > 1) { const sp = Math.min(d, 210 * dt); w.x += (w.tx - w.x) / d * sp; w.y += (w.ty - w.y) / d * sp; w.facing = (w.tx - w.x) >= 0 ? 1 : -1; w.walking = true; }
    else { w.walking = false; if (isStation(w.assignment)) w.facing = STATIONS[w.assignment].spot.x < W / 2 ? 1 : -1; }
    w.flash = Math.max(0, w.flash - dt * 2); w.mentorFlash = Math.max(0, w.mentorFlash - dt * 1.2); w.bump = Math.max(0, w.bump - dt * 1.5);
  }
}
function updateEffects(dt) {
  const E = state.effects;
  for (let i = E.length - 1; i >= 0; i--) {
    const e = E[i]; e.t += dt;
    if (e.type === 'ring') {
      const r = easeOut(Math.min(1, e.t / e.dur)) * e.maxR;
      for (const w of state.workers) if (w.unlocked && isStation(w.assignment) && !e.hits.has(w.id) && dist(w, { x: e.x, y: e.y }) <= r) {
        e.hits.add(w.id); w.mentorFlash = 1; addEffect({ type: 'xpfloat', x: w.x - 14, y: w.y - 62, t: 0, dur: 1.3 });
      }
    }
    if (e.type === 'shard' && e.t >= e.dur) { e.target.flash = 1; addEffect({ type: 'burst', x: e.to.x, y: e.to.y, t: 0, dur: .45, color: e.color, r: 26, rays: 8 }); }

let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now; realTime += rdt;
  updatePlayer(rdt);
  updateWorkers(rdt);
  updateCamera(rdt);
  if (state.phase === 'work') { const sdt = rdt * state.speed; const steps = Math.ceil(sdt / 0.05); for (let i = 0; i < steps && state.phase === 'work'; i++) simTick(sdt / steps); }
  updateEffects(rdt * (state.phase === 'work' ? state.speed : 1));
  state.founder.screenFlash = Math.max(0, state.founder.screenFlash - rdt);
  // the cash counter ticks up toward the real value so earnings feel continuous
  const gap = state.money - state.displayMoney;
  state.displayMoney = Math.abs(gap) < .6 ? state.money : state.displayMoney + gap * (1 - Math.exp(-7 * rdt));
  state.target = state.menu ? state.target : findTarget();
  if (state.phase === 'work' && (Math.floor(realTime * 10) % 2 === 0)) { updateHUD(); if (Math.floor(realTime * 2) !== state._trayT) { state._trayT = Math.floor(realTime * 2); renderTray(); } }

/* RENDERING */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function text(s, x, y, size, color, align = 'center', weight = 600) { ctx.font = `${weight} ${size}px "Segoe UI",Heebo,Rubik,Assistant,"Noto Sans Hebrew",Arial,"DejaVu Sans",sans-serif`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.direction = 'rtl'; ctx.fillText(s, x, y); }

// bake the floor, lamp glows and walls once; they cost several gradients per frame otherwise
function buildStaticLayer() {
  bg.width = canvas.width; bg.height = canvas.height;
  const main = ctx; ctx = bgx;
  ctx.setTransform(canvas._k, 0, 0, canvas._k, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawFloorStatic(); drawLights(); drawWallsStatic();
  ctx = main;
}

function render() {
  const k = canvas._k; ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bg, 0, 0, W, H);
  drawStationGlow();
  drawZoneHighlights();
  // depth-sorted world items
  const items = [];
  for (const id of STATION_ORDER) items.push({ y: STATIONS[id].desk.y + STATIONS[id].desk.h, draw: () => drawStationDesk(id) });
  items.push({ y: FOUNDER.desk.y + FOUNDER.desk.h, draw: drawFounderDesk });
  items.push({ y: SOFA.y + SOFA.h - 20, draw: drawSofa });
  items.push({ y: BENCH.y + BENCH.h, draw: drawBench, early: true });
  PLANTS.forEach(p => items.push({ y: p.y, draw: () => drawPlant(p.x, p.y, p.s) }));
  items.push({ y: COOLER.y + COOLER.h, draw: drawCooler });
  for (const w of state.workers) if (w.unlocked) items.push({ y: w.y, draw: () => drawWorker(w) });
  items.push({ y: state.player.y, draw: drawPlayer });
  // bench: draw before the workers standing on it
  items.sort((a, b) => (a.early ? BENCH.y : a.y) - (b.early ? BENCH.y : b.y));
  drawPlayerRing();
  for (const it of items) it.draw();
  drawDayLight();
  drawEvents();
  drawEffects();
  drawOverlays();
}

// everything below never changes frame to frame, so it is baked once into an offscreen canvas
function drawFloorStatic() {
  const g = ctx.createLinearGradient(0, FLOOR.y, 0, FLOOR.y + FLOOR.h); g.addColorStop(0, '#221a58'); g.addColorStop(1, '#170f3f');
  ctx.fillStyle = g; ctx.fillRect(FLOOR.x, FLOOR.y, FLOOR.w, FLOOR.h);

  ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(b.x + 3, b.y + 6, b.w, b.h, 8); ctx.fill();
  ctx.fillStyle = '#5a4a3a'; rr(b.x, b.y, b.w, b.h, 8); ctx.fill();
  ctx.fillStyle = '#6e5b47'; for (let i = 0; i < 5; i++) { rr(b.x + 4, b.y + 8 + i * 58, b.w - 8, 50, 5); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.06)'; rr(b.x + 4, b.y + 4, b.w - 8, 5, 3); ctx.fill();
  ctx.fillStyle = 'rgba(10,6,30,.85)'; rr(b.x - 4, b.y - 26, 62, 20, 10); ctx.fill(); ctx.strokeStyle = 'rgba(167,154,208,.6)'; ctx.lineWidth = 1; ctx.stroke();
  text('ספסל', b.x + 27, b.y - 15, 12, '#fff');
}
function drawPlant(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(2, 4, 16, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#b8613a'; rr(-12, -14, 24, 20, 5); ctx.fill(); ctx.fillStyle = '#d3774a'; rr(-14, -18, 28, 7, 3); ctx.fill();
  const sway = Math.sin(realTime * 1.2 + x) * 2;
  [['#2e9e5b', -10, -34, -.5], ['#3dbb6f', 8, -38, .4], ['#57d98a', -2, -46, 0], ['#2e9e5b', 12, -26, .9], ['#3dbb6f', -14, -24, -1]].forEach(([c, ox, oy, rot]) => {
    ctx.save(); ctx.translate(ox + sway * .5, oy); ctx.rotate(rot); ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(0, 0, 7, 15, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  });
  ctx.restore();
}
function drawCooler() {
  const c = COOLER; ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(c.x + c.w / 2 + 2, c.y + c.h, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d9dcef'; rr(c.x, c.y + 14, c.w, c.h - 14, 4); ctx.fill();
  ctx.fillStyle = 'rgba(93,214,255,.7)'; rr(c.x + 3, c.y, c.w - 6, 20, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(c.x + 8, c.y + 8 - (realTime * 8 % 10), 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5dd6ff'; ctx.fillRect(c.x + 8, c.y + 24, 4, 4); ctx.fillStyle = '#ff7a59'; ctx.fillRect(c.x + 14, c.y + 24, 4, 4);
}

/* ---------- creatures ---------- */
function shadow(x, y, w) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x, y + 2, w, w * .38, 0, 0, Math.PI * 2); ctx.fill(); }

/* ---- כלים לציור "תלת-ממדי רך": כל צורה מקבלת אור, צל ונפח במקום צבע שטוח ---- */
// אליפסה מוצללת כמו כדור מואר — נקודת האור מוסטת לכיוון המקור
function orb(x, y, rx, ry, lit, mid, dark, lx, ly) {
  const R = Math.max(rx, ry);
  const g = ctx.createRadialGradient(x + rx * (lx === undefined ? -.36 : lx), y + ry * (ly === undefined ? -.44 : ly), R * .05, x, y, R * 1.15);
  g.addColorStop(0, lit); g.addColorStop(.22, mid); g.addColorStop(1, dark);
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
}
// צל מגע רך במקום שבו שתי צורות נפגשות (Ambient Occlusion)
function ao(x, y, rx, ry, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
  g.addColorStop(0, `rgba(10,26,48,${a === undefined ? .3 : a})`); g.addColorStop(1, 'rgba(10,26,48,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
}
// קרן/סנפיר מחודד עם קצה מעוגל וגרדיאנט לרוחב — קונוס, לא משולש שטוח
function horn(bx, by, tx, ty, w, lit, mid, dark) {
  const ang = Math.atan2(ty - by, tx - bx), nx = Math.cos(ang + Math.PI / 2), ny = Math.sin(ang + Math.PI / 2);
  const mx = lerp(bx, tx, .55), my = lerp(by, ty, .55);
  ctx.beginPath();
  ctx.moveTo(bx + nx * w, by + ny * w);
  ctx.quadraticCurveTo(mx + nx * w * .72, my + ny * w * .72, tx, ty);
  ctx.quadraticCurveTo(mx - nx * w * .72, my - ny * w * .72, bx - nx * w, by - ny * w);
  ctx.closePath();
  const g = ctx.createLinearGradient(bx + nx * w, by + ny * w, bx - nx * w, by - ny * w);
  g.addColorStop(0, lit); g.addColorStop(.5, mid); g.addColorStop(1, dark);
  ctx.fillStyle = g; ctx.fill();
}
// הבהוב אור על הקצה העליון — מה שנותן את התחושה שיש נפח ולא מדבקה
function rimLight(x, y, rx, ry, a, from, to) {
  ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.clip();
  ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 3.2;
  ctx.beginPath(); ctx.ellipse(x, y, rx - 1, ry - 1, 0, from, to); ctx.stroke(); ctx.restore();
}
function desat(hex, f) { // f = 0..1 how much to desaturate
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const l = 0.3 * r + 0.59 * g + 0.11 * b;
  r = lerp(r, l * .85, f); g = lerp(g, l * .85, f); b = lerp(b, l * .85, f); return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function eyes(x1, x2, y, r, o) {
  const blink = ((realTime * 1.1 + o.seed) % 3.7) < 0.12 || o.sleep;
  for (const ex of [x1, x2]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, y, r, blink ? r * .12 : r, 0, 0, Math.PI * 2); ctx.fill();
    if (!blink) {
      ctx.fillStyle = '#1b1430'; ctx.beginPath(); ctx.arc(ex + r * .2 * (o.look || 0), y + r * .15, r * .55, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + r * .3, y - r * .2, r * .2, 0, Math.PI * 2); ctx.fill();
      if (o.tired > 0) { ctx.fillStyle = o.lid; ctx.beginPath(); ctx.ellipse(ex, y - r + o.tired * r * .9, r + 1, r * .9, 0, Math.PI, 0); ctx.fill(); }
    }
  }
}
function mouth(x, y, w, happy) {
  ctx.strokeStyle = '#1b1430'; ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.beginPath();
  if (happy > .5) ctx.arc(x, y - 1, w, 0.15 * Math.PI, 0.85 * Math.PI); else if (happy > 0) { ctx.moveTo(x - w, y); ctx.lineTo(x + w, y); } else ctx.arc(x, y + w + 1, w, 1.2 * Math.PI, 1.8 * Math.PI);
  ctx.stroke();
}
function hands(working, col, y = -18) { // little typing hands
  if (!working) return;
  for (const s of [-1, 1]) { const hy = y + Math.sin(realTime * 14 + (s > 0 ? Math.PI : 0)) * 2; ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(s * 10, hy, 4, 3, 0, 0, Math.PI * 2); ctx.fill(); }
}

function drawCreature(kind, o) {
  // o: {x,y,fatigue,facing,level,growth,working,walking,sleep,seed,flash,mentorFlash,bump,keepSat,color}
  const f = o.fatigue || 0, tired = o.keepSat ? 0 : clamp((f - 30) / 70, 0, 1);
  const energy = 1 - tired * .7;
  const t = realTime + (o.seed || 0);
  const bob = o.walking ? Math.abs(Math.sin(t * 12)) * 4 : Math.sin(t * (2.2 * energy + .6)) * (2.2 * energy + .5);
  const sc = (1 + ((o.level || 1) - 1) * .07) * (1 + (o.bump || 0) * .18);
  const dsf = o.keepSat ? 0 : clamp(f / 100, 0, 1) * .75;
  const C = c => desat(c, dsf);
  shadow(o.x, o.y, 18 * sc);
  ctx.save(); ctx.translate(o.x, o.y - bob); ctx.scale(sc * (o.facing < 0 ? -1 : 1), sc);
  const eo = { seed: o.seed || 0, tired, lid: C(o.lidColor || '#333'), sleep: o.sleep, look: o.working ? -0.6 : 0 };
  const happy = o.sleep ? .3 : (tired > .6 ? 0 : (tired > .3 ? .4 : 1));
  if (kind === 'player') {
    /* דרקון-לוחם צעיר: עור תכלת בהיר מול שריון נייבי כהה עם קווי זוהר טורקיז,
       ראש מוארך עם לסת, כתר קרניים כהה, ידיים פתוחות בתנוחת "מוכן". */
    const SK_L = C('#6FC3EE'), SK_M = C('#2E8AC9'), SK_D = C('#123A5E');   // עור — בהיר אבל תמיד כחול, לא לבן
    const AR_L = C('#3C5B78'), AR_M = C('#1B2E42'), AR_D = C('#0A1520');   // שריון כהה
    const GLOW = C('#5FE8E0');                                            // קו זוהר טורקיז
    const step = o.walking ? Math.sin(t * 12) : 0;
    const lx = -.36 * (o.facing < 0 ? -1 : 1);
    const glow = (x1, y1, x2, y2, w) => { ctx.save(); ctx.globalAlpha = .8; ctx.shadowColor = GLOW; ctx.shadowBlur = 4;
      ctx.strokeStyle = GLOW; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); };

    // ----- זנב, יוצא מבסיס הגוף (לא צף בנפרד) -----
    ctx.save(); ctx.translate(-9, -13); ctx.rotate(Math.sin(t * 3) * .08 + .34);
    ctx.beginPath(); ctx.moveTo(3, -5); ctx.quadraticCurveTo(-9, -6.5, -19, 0);
    ctx.quadraticCurveTo(-9, 5, 3, 6); ctx.closePath();
    const tg = ctx.createLinearGradient(3, -6, -19, 6); tg.addColorStop(0, SK_M); tg.addColorStop(1, SK_D);
    ctx.fillStyle = tg; ctx.fill();
    for (let i = 0; i < 3; i++) horn(-2 - i * 5, -4 + i * .4, -5 - i * 5, -9.5 - i * .4, 2.2 - i * .3, AR_L, AR_M, AR_D);
    ctx.restore();

    // ----- רגליים משוריינות, עומדות ברוחב -----
    for (const sg of [-1, 1]) { const off = step * 2.6 * (sg > 0 ? 1 : -1);
      orb(sg * 11 + off, -5, 6.6, 5.6, SK_L, SK_M, SK_D, lx, -.4);       // כף רגל
      for (let k = -1; k <= 1; k++) { ctx.fillStyle = AR_M; ctx.beginPath(); ctx.moveTo(sg * 11 + off + k * 3.6, -8); ctx.lineTo(sg * 11 + off + k * 3.6 - 1.1, -2.5); ctx.lineTo(sg * 11 + off + k * 3.6 + 1.1, -2.5); ctx.closePath(); ctx.fill(); }
      orb(sg * 10.5 + off * .5, -15, 7.2, 10.5, AR_L, AR_M, AR_D, lx, -.5);  // מגן שוק
      glow(sg * 10.5 + off * .5 - 5, -18, sg * 10.5 + off * .5 - 5, -10, 1.6); }

    // ----- גוף -----
    orb(0, -25, 15, 17, SK_L, SK_M, SK_D, lx, -.46);
    ao(0, -12, 13, 7, .32);
    // לוחית חזה כהה גדולה
    ctx.save();
    ctx.beginPath(); ctx.moveTo(-11, -35); ctx.quadraticCurveTo(0, -31, 11, -35);
    ctx.quadraticCurveTo(10, -18, 0, -12); ctx.quadraticCurveTo(-10, -18, -11, -35); ctx.closePath(); ctx.clip();
    const cg = ctx.createLinearGradient(-11, -35, 9, -12); cg.addColorStop(0, AR_L); cg.addColorStop(.55, AR_M); cg.addColorStop(1, AR_D);
    ctx.fillStyle = cg; ctx.fillRect(-16, -40, 32, 34);
    ctx.restore();
    glow(-6, -30, -6, -16, 1.4); glow(6, -30, 6, -16, 1.4);
    glow(-8, -32, 8, -32, 1.2);
    rimLight(0, -25, 15, 17, .28, Math.PI * 1.08, Math.PI * 1.6);

    // ----- כתפיות בולטות -----
    for (const sg of [-1, 1]) { orb(sg * 14, -34, 7, 6.4, AR_L, AR_M, AR_D, lx, -.55); glow(sg * (14 - 4), -37, sg * (14 + 3), -33, 1.3); }

    // ----- ידיים פתוחות בתנוחת "מוכן" -----
    for (const sg of [-1, 1]) { const ay = o.walking ? Math.sin(t * 12 + (sg > 0 ? 0 : Math.PI)) * 2.2 : Math.sin(t * 1.6) * 1;
      ctx.save(); ctx.translate(sg * 15.5, -25 + ay); ctx.rotate(sg * .55);
      orb(0, 0, 4.6, 9, SK_L, SK_M, SK_D, lx, -.5);                 // עליון-זרוע
      orb(0, 10, 4.2, 6.6, AR_L, AR_M, AR_D, lx, -.5);              // גאנטלט
      ctx.fillStyle = SK_M;                                          // כף יד + טפרים
      for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(k * 2.6, 14); ctx.lineTo(k * 2.6 - .8, 19); ctx.lineTo(k * 2.6 + .8, 19); ctx.closePath(); ctx.fill(); }
      ctx.restore(); }

    // ----- כתר קרניים (מאחורי הראש) -----
    horn(-6, -56, -20, -74, 4.6, AR_L, AR_M, AR_D);
    horn(5, -58, 4, -80, 5, AR_L, AR_M, AR_D);
    horn(15, -55, 26, -73, 4.2, AR_L, AR_M, AR_D);
    horn(-15, -50, -30, -58, 3.4, AR_L, AR_M, AR_D);
    horn(16, -48, 30, -54, 3.4, AR_L, AR_M, AR_D);

    // ----- ראש: גולגולת עגולה + חוטם ממורכז שבולט קדימה (לא הצידה — כדי שהפרצוף יישאר קדמי-סימטרי) -----
    ao(0, -34, 12, 5, .3);
    orb(0, -53, 14.5, 12.5, SK_L, SK_M, SK_D, lx, -.5);          // גולגולת/קודקוד
    orb(0, -40.5, 10.5, 9, SK_L, SK_M, SK_D, lx, -.2);           // חוטם ממורכז — מואר מהחזית
    ao(0, -34, 8.5, 3.4, .26);                                    // צל מתחת לחוטם -> מפריד אותו מהגוף
    // מגן-מצח כהה מעל העיניים
    ctx.fillStyle = AR_M; ctx.beginPath();
    ctx.moveTo(-13, -60); ctx.quadraticCurveTo(0, -65.5, 13, -60); ctx.quadraticCurveTo(8, -55.5, 0, -55); ctx.quadraticCurveTo(-8, -55.5, -13, -60);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = C('#173F63');                                 // נחיריים
    ctx.beginPath(); ctx.ellipse(-3.4, -38.5, 1.3, 1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3.4, -38.5, 1.3, 1, 0, 0, Math.PI * 2); ctx.fill();
    rimLight(0, -53, 14.5, 12.5, .3, Math.PI * 1.12, Math.PI * 1.7);
    rimLight(0, -40.5, 10.5, 9, .22, Math.PI * 1.15, Math.PI * 1.6);

    // עיניים — סימטריות משני צדי החוטם
    ctx.save(); ctx.strokeStyle = 'rgba(10,20,35,.55)'; ctx.lineWidth = 1.2;
    for (const ex of [-8, 8]) { ctx.beginPath(); ctx.arc(ex, -53.5, 2.7, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
    eyes(-8, 8, -53.5, 2.4, eo);
    mouth(0, -37, 2.8, o.walking ? 1 : happy);
  }
  else if (kind === 'iron') {
    const bodyC = C('#3d6bff');
    ctx.fillStyle = C('#22408f'); rr(-19, -40, 38, 40, 12); ctx.fill();
    ctx.fillStyle = bodyC; rr(-18, -44, 36, 40, 12); ctx.fill();
    // plates
    ctx.fillStyle = C('#2a4fc4'); for (let i = 0; i < 3; i++) { rr(-17, -20 + i * 6, 34, 4, 2); ctx.fill(); }
    ctx.fillStyle = C('#8fb0ff'); for (const rx of [-13, 13]) for (const ry of [-18, -12, -6]) { ctx.beginPath(); ctx.arc(rx, ry + 2, 1.3, 0, Math.PI * 2); ctx.fill(); }
    // shoulder pads
    ctx.fillStyle = C('#2a4fc4'); rr(-24, -38, 9, 14, 4); ctx.fill(); rr(15, -38, 9, 14, 4); ctx.fill();
    // visor
    ctx.fillStyle = '#0c1030'; rr(-14, -38, 28, 12, 6); ctx.fill();
    const glow = tired > .6 ? '#8fa8ff' : '#7df3ff';
    ctx.save(); ctx.shadowColor = glow; ctx.shadowBlur = 8; ctx.fillStyle = glow; const blink = ((t * 1.1) % 3.7) < 0.12; ctx.fillRect(-9, -34, 6, blink ? 1 : 3 + (tired > .5 ? 0 : 1)); ctx.fillRect(3, -34, 6, blink ? 1 : 3 + (tired > .5 ? 0 : 1)); ctx.restore();
    // antenna
    ctx.strokeStyle = C('#8fb0ff'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -44); ctx.lineTo(0, -54); ctx.stroke(); ctx.fillStyle = (Math.sin(t * 4) > 0) ? '#ff6b6b' : '#7a2c2c'; ctx.beginPath(); ctx.arc(0, -56, 3, 0, Math.PI * 2); ctx.fill();
    mouth(0, -20, 3, happy);
    hands(o.working, C('#2a4fc4'), -10);
    ctx.fillStyle = C('#22408f'); rr(-15, -4, 12, 6, 3); ctx.fill(); rr(3, -4, 12, 6, 3); ctx.fill();
  }
  else if (kind === 'nature') {
    const gr = o.growth || 0;
    // growth aura
    if (o.working) { ctx.save(); ctx.globalAlpha = .12 + gr * .22; ctx.fillStyle = '#7dffb0'; ctx.beginPath(); ctx.arc(0, -22, 22 + gr * 22 + Math.sin(t * 3) * 2, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
    // body teardrop
    const g = ctx.createLinearGradient(0, -50, 0, 0); g.addColorStop(0, C('#8ce68a')); g.addColorStop(1, C('#37a85a'));
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, -52); ctx.bezierCurveTo(22, -40, 22, -4, 0, 0); ctx.bezierCurveTo(-22, -4, -22, -40, 0, -52); ctx.fill();
    ctx.fillStyle = C('#bff5b0'); ctx.beginPath(); ctx.ellipse(0, -14, 11, 9, 0, 0, Math.PI * 2); ctx.fill();
    // sprout leaves scale with growth
    const ls = .55 + gr * .75 + (o.working ? Math.sin(t * 2) * .05 : 0);
    ctx.save(); ctx.translate(0, -50); ctx.scale(ls, ls);
    for (const s of [-1, 1]) { ctx.save(); ctx.rotate(s * .9 + Math.sin(t * 1.5) * .08); ctx.fillStyle = C(s < 0 ? '#57d98a' : '#3dbb6f'); ctx.beginPath(); ctx.ellipse(0, -12, 6, 13, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
    ctx.strokeStyle = C('#2e9e5b'); ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(0, -8); ctx.stroke();
    if (gr > .95) { ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(0, -10, 4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#ff9fcf'; for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 + t; ctx.beginPath(); ctx.arc(Math.cos(a) * 6, -10 + Math.sin(a) * 6, 2.5, 0, Math.PI * 2); ctx.fill(); } }
    ctx.restore();
    eyes(-6, 6, -30, 4.6, eo);
    ctx.fillStyle = 'rgba(255,140,170,.55)'; ctx.beginPath(); ctx.arc(-11, -24, 3, 0, Math.PI * 2); ctx.arc(11, -24, 3, 0, Math.PI * 2); ctx.fill();
    mouth(0, -22, 3.5, happy);
    hands(o.working, C('#37a85a'), -12);
  }
  else if (kind === 'stone') {
    ctx.fillStyle = C('#6f7486'); ctx.beginPath(); ctx.moveTo(-20, -6); ctx.lineTo(-22, -26); ctx.lineTo(-12, -44); ctx.lineTo(8, -48); ctx.lineTo(22, -34); ctx.lineTo(24, -12); ctx.lineTo(14, 0); ctx.lineTo(-12, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C('#8f95a8'); ctx.beginPath(); ctx.moveTo(-16, -8); ctx.lineTo(-18, -26); ctx.lineTo(-10, -40); ctx.lineTo(6, -44); ctx.lineTo(18, -32); ctx.lineTo(19, -12); ctx.lineTo(10, -3); ctx.lineTo(-8, -3); ctx.closePath(); ctx.fill();
    // moss
    ctx.fillStyle = C('#4caf6a'); ctx.beginPath(); ctx.ellipse(-6, -42, 9, 4, -.3, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.ellipse(14, -16, 5, 3, .5, 0, Math.PI * 2); ctx.fill();
    // cracks
    ctx.strokeStyle = C('#4d5163'); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-14, -20); ctx.lineTo(-9, -14); ctx.lineTo(-11, -8); ctx.moveTo(12, -36); ctx.lineTo(9, -30); ctx.stroke();
    // heavy brow
    ctx.fillStyle = C('#4d5163'); rr(-13, -34, 26, 5, 2); ctx.fill();
    eyes(-6, 6, -26, 3.8, { ...eo, tired: 0 });
    mouth(0, -16, 4, happy > .5 ? .4 : happy);
    hands(o.working, C('#6f7486'), -10);
    // steady icon: a small anchor-ish weight under the creature when fatigued but working
    if (o.working && f > 40) { ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(-1.5, 4, 3, 7); ctx.fillRect(-6, 10, 12, 3); }
  }
  else if (kind === 'crystal') {
    // glow

      case 'wilt': { ctx.globalAlpha = 1 - k; for (let i = 0; i < 5; i++) { ctx.fillStyle = '#8bd98a'; ctx.save(); ctx.translate(e.x + (i - 2) * 9 + Math.sin(k * 5 + i) * 4, e.y + k * 40 + i * 3); ctx.rotate(k * 4 + i); ctx.beginPath(); ctx.ellipse(0, 0, 2.5, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); } text('הצמיחה אופסה', e.x, e.y - 20, 11, '#8bd98a'); break; }
      case 'unlock': { ctx.globalAlpha = 1 - k; for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, r = easeOut(k) * 60; ctx.fillStyle = i % 3 === 0 ? '#fff' : (i % 3 === 1 ? e.color : '#ffd166'); ctx.beginPath(); ctx.arc(e.x + Math.cos(a) * r, e.y + Math.sin(a) * r * .6 - k * 20, 3, 0, Math.PI * 2); ctx.fill(); } ctx.strokeStyle = e.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, easeOut(k) * 50, 0, Math.PI * 2); ctx.stroke(); break; }
      case 'upgrade': { ctx.globalAlpha = 1 - k; ctx.strokeStyle = e.color; ctx.lineWidth = 3; rr(e.x - 100 - k * 20, e.y - 40 - k * 20, 200 + k * 40, 80 + k * 40, 14); ctx.stroke(); for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; ctx.fillStyle = i % 2 ? e.color : '#fff'; ctx.beginPath(); ctx.arc(e.x + Math.cos(a) * (30 + k * 80), e.y + Math.sin(a) * (20 + k * 50) - k * 30, 3, 0, Math.PI * 2); ctx.fill(); } text('▲ שדרוג', e.x, e.y - 60 - k * 20, 15, e.color, 'center', 800); break; }
      case 'evtSpawn': { ctx.globalAlpha = 1 - k; ctx.strokeStyle = e.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(e.x, e.y, 8 + easeOut(k) * 46, 0, Math.PI * 2); ctx.stroke(); break; }
      case 'openFlash': { ctx.globalAlpha = (1 - k) * .25; ctx.fillStyle = '#5dd6ff'; ctx.fillRect(FLOOR.x, FLOOR.y, FLOOR.w, FLOOR.h); break; }
    }
    ctx.restore();
  }
}
function drawOverlays() {
  // interaction prompt
  const t = state.target;
  if (t && !state.menu) {
    let x, y, label;
    if (t.type === 'worker') { x = t.w.x; y = t.w.y - 98; label = 'רווח · דבר'; }
    else if (t.type === 'event') { const q = eventPos(t.ev); x = q.x; y = q.y - 40; label = EVENT_DEFS[t.ev.type].hint; }
    else { x = FOUNDER.desk.x + FOUNDER.desk.w / 2; y = FOUNDER.desk.y - 46; label = 'רווח · עבודה'; }
    const bob = Math.sin(realTime * 4) * 2;
    ctx.fillStyle = 'rgba(255,209,102,.95)'; rr(x - 46, y - 12 + bob, 92, 24, 12); ctx.fill();
    text(label, x, y + 1 + bob, 13, '#2a1a05', 'center', 800);
    ctx.fillStyle = 'rgba(255,209,102,.95)'; ctx.beginPath(); ctx.moveTo(x - 5, y + 12 + bob); ctx.lineTo(x + 5, y + 12 + bob); ctx.lineTo(x, y + 18 + bob); ctx.closePath(); ctx.fill();
  }
  drawHint();
}

// הדרכה קצרה, רק ביום הראשון, ורק אם השחקן עצר ולא יודע מה לעשות
function nextHint() {
  if (state.day !== 1 || state.phase === 'summary' || state.phase === 'end') return null;
  if (state.phase === 'morning') {
    if (workingCount() < activeSlots()) {
      const w = state.workers.filter(x => x.unlocked && !isStation(x.assignment))
        .sort((a, b) => dist(state.player, a) - dist(state.player, b))[0];
      if (w) return { x: w.x, y: w.y - 96, text: 'לך אליו ולחץ רווח', sub: 'כך בוחרים מי עובד ואיפה' };
    }
    return { x: 640, y: FLOOR.y + 34, text: 'הצוות מוכן — לחץ "פותחים" למעלה', up: true };
  }
  if (state.phase === 'work') {
    if (state.events.length) { const e = state.events.find(x => !EVENT_DEFS[x.type].walkOver) || state.events[0];
      const q = eventPos(e); return { x: q.x, y: q.y - 56, text: 'קרה משהו — לך לשם', sub: EVENT_DEFS[e.type].name }; }
    if (state.founder.usesLeft === CONFIG.founderComputer.usesPerDay && founderCanUse().ok)
      return { x: FOUNDER.desk.x + FOUNDER.desk.w / 2, y: FOUNDER.desk.y - 62, text: 'לך למחשב שלך', sub: 'תן דחיפה לתחנה שתבחר' };
  }
  return null;
}
function drawHint() {
  if (state.idle < 3) return;
  const h = nextHint(); if (!h) return;
  const fade = clamp((state.idle - 3) / .6, 0, 1);
  const bob = Math.sin(realTime * 3) * 5;
  ctx.save(); ctx.globalAlpha = fade * .95;
  const wdt = Math.max(150, h.text.length * 8 + 26);
  ctx.fillStyle = 'rgba(10,6,30,.9)'; rr(h.x - wdt / 2, h.y - 20 + bob, wdt, h.sub ? 38 : 26, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(93,214,255,.75)'; ctx.lineWidth = 1.5; ctx.stroke();
  text(h.text, h.x, h.y - 7 + bob, 13, '#bff1ff', 'center', 700);
  if (h.sub) text(h.sub, h.x, h.y + 9 + bob, 11, 'rgba(167,154,208,.95)');
  // arrow: up toward the HUD button, otherwise down at the thing in the world
  ctx.fillStyle = 'rgba(93,214,255,.9)';
  ctx.beginPath();
  if (h.up) { ctx.moveTo(h.x - 7, h.y - 24 + bob); ctx.lineTo(h.x + 7, h.y - 24 + bob); ctx.lineTo(h.x, h.y - 34 + bob); }
  else { const by = h.y + (h.sub ? 20 : 8) + bob; ctx.moveTo(h.x - 7, by); ctx.lineTo(h.x + 7, by); ctx.lineTo(h.x, by + 10); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

/* ===================================================================================== */
/* DEBUG / PLAYTEST HOOK (no gameplay effect) */
window.SK = {
  CONFIG, state, cam, viewRect, saveGame, applySave, readStore, clearSave, dayTarget, starsFor, assign, openBusiness, endDay, nextDay, upgradeStation, founderFocus, startDay,
  keys, findTarget, onInteract, closeMenu, spawnEvent, resolveEvent, EVENT_DEFS, bugOn, stuckOn,
  forceEvent(type) { for (let i = 0; i < 400; i++) { const n = state.events.length; spawnEvent(); const e = state.events[state.events.length - 1]; if (state.events.length > n && e.type === type) return e; if (state.events.length > n) state.events.pop(); } return null; },
  advance(sec) { const step = 0.05; let n = Math.round(sec / step); while (n-- > 0 && state.phase === 'work') { simTick(step); updateEffects(step); updateWorkers(step); } updateHUD(); renderTray(); },
  teleport(x, y) { state.player.x = x; state.player.y = y; state.target = findTarget(); },
  worker(id) { return state.workers.find(w => w.id === id); },
  snapshot() { return { day: state.day, phase: state.phase, money: Math.round(state.money), time: Math.round(state.time), moves: state.movesLeft, levels: { ...state.stationLevels }, workers: state.workers.filter(w => w.unlocked).map(w => ({ id: w.id, a: w.assignment, lvl: w.level, xp: Math.round(w.xp), fat: Math.round(w.fatigue), growth: +w.growth.toFixed(2), rate: +w.rate.toFixed(2) })), founder: { ...state.founder } }; },
};

/* ===================================================================================== */
/* SAVE / LOAD — הכול עטוף ב-try/catch כדי שגלישה פרטית או חסימת אחסון לא ישברו את המשחק */
function readStore() { try { const raw = localStorage.getItem(CONFIG.saveKey); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function writeStore(o) { try { localStorage.setItem(CONFIG.saveKey, JSON.stringify(o)); return true; } catch (e) { return false; } }
function clearSave() { try { const b = state.bestScore || 0; localStorage.setItem(CONFIG.saveKey, JSON.stringify({ best: b })); } catch (e) {} }

function saveGame() {
  writeStore({
    v: 1, day: state.day, money: state.money, levels: { ...state.stationLevels },
    confidence: state.confidence, stars: state.stars, totalEarned: state.totalEarned,
    history: state.history.map(d => ({ day: d.day, total: d.total, stars: d.stars })),
    workers: state.workers.map(w => ({ id: w.id, unlocked: w.unlocked, level: w.level, xp: w.xp, fatigue: w.fatigue })),
    best: Math.max(state.bestScore || 0, state.totalEarned || 0),
  });
}
function applySave(d) {
  state.money = d.money || 0; state.stationLevels = { ...state.stationLevels, ...(d.levels || {}) };
  state.confidence = d.confidence != null ? d.confidence : CONFIG.goals.confidenceStart;
  state.stars = d.stars || []; state.totalEarned = d.totalEarned || 0; state.history = d.history || [];
  state.lastDayStats = state.history.length ? state.history[state.history.length - 1] : null;
  for (const sw of (d.workers || [])) { const w = state.workers.find(x => x.id === sw.id); if (!w) continue;
    w.unlocked = !!sw.unlocked; w.level = sw.level || 1; w.xp = sw.xp || 0; w.fatigue = sw.fatigue || 0; }
  startDay(clamp(d.day || 1, 1, CONFIG.totalDays));
}

/* ---------- opening gate: continue or start fresh ---------- */
function bootGate() {
  const saved = readStore();
  state.bestScore = (saved && saved.best) || 0;
  const canContinue = saved && saved.day && saved.day >= 1 && saved.day <= CONFIG.totalDays && saved.workers;
  const btns = $('gateBtns');
  btns.innerHTML = canContinue
    ? `<button class="btn" id="contBtn">המשך · יום ${saved.day}</button><button class="btn ghost" id="freshBtn">שבוע חדש</button>`
    : `<button class="btn" id="freshBtn">מתחילים</button>`;
  $('gateBest').textContent = state.bestScore ? `השיא שלך: ${fmt(state.bestScore)}` : '';
  const close = () => { $('gate').style.display = 'none'; };
  if (canContinue) $('contBtn').onclick = () => { applySave(saved); close(); };
  $('freshBtn').onclick = () => { clearSave(); startDay(1); close(); };
}

startDay(1);
bootGate();
requestAnimationFrame(frame);
</script>
